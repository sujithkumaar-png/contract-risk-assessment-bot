[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-risk-platform-backend"
version = "0.1.0"
description = "Additive platform foundation using the existing contract risk engine"
requires-python = ">=3.10"
dependencies = [
  "contract-risk-assessment-bot==1.0.0",
  "fastapi>=0.110,<1.0",
  "pydantic>=2.6,<3.0",
  "uvicorn>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
